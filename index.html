<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 阿威相片 👻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060409;
  --card:#100b16;
  --accent:#c94f0d;
  --purple:#5c2d91;
  --purple-lt:#8a5bbf;
  --toxic:#38b000;
  --blood:#a1122c;
  --bone:#d8d2c4;
  --muted:#6f6585;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--purple) var(--bg)}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 60% 40% at 16% 12%, rgba(232,226,242,.07), transparent 70%),
    linear-gradient(180deg, #04030a 0%, #080512 38%, #0d0718 62%, #070409 100%);
  background-attachment:fixed;
  color:var(--bone);
  font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif;
}

/* ══ 月亮 ══ */
.moon-wrap{position:fixed;top:9%;left:11%;width:150px;height:150px;z-index:1;pointer-events:none}
.moon-halo{position:absolute;inset:-70px;
  background:radial-gradient(circle, rgba(232,226,242,.22), rgba(232,226,242,.05) 55%, transparent 70%);}

/* ══ 破碎老城 + 老城堡 ══ */
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:62vh;z-index:1;pointer-events:none}

/* ══ 濃霧 ══ */
.fog{position:fixed;left:-10%;right:-10%;bottom:0;height:30vh;z-index:2;pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(92,45,145,.06) 45%, rgba(16,10,24,.5));}
.fog-strip{position:fixed;left:0;bottom:0;width:200%;height:16vh;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 220px, rgba(120,90,160,.05) 220px 520px);
  filter:blur(16px);animation:fogdrift 80s linear infinite;}
.fog-strip.f2{height:24vh;bottom:10vh;opacity:.7;animation-duration:120s;animation-direction:reverse}
@keyframes fogdrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ══ 星空 & 蜘蛛網 ══ */
.star{position:fixed;pointer-events:none;z-index:2;color:#9b93b0;font-size:10px;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.5}}
.web{position:fixed;pointer-events:none;z-index:4}
.web-tl{top:52px;left:-8px;width:150px;opacity:.34}
.web-tr{top:52px;right:-8px;width:150px;opacity:.34;transform:scaleX(-1)}
.web-bl{bottom:64px;left:-8px;width:120px;opacity:.28;transform:scaleY(-1)}
.web-br{bottom:64px;right:-8px;width:120px;opacity:.28;transform:scale(-1,-1)}
.hang-web{position:fixed;pointer-events:none;z-index:4;transform-origin:top center;animation:sway 5.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.spider-thread{position:fixed;pointer-events:none;z-index:4;transform-origin:top center;animation:sway 4s ease-in-out infinite alternate}

/* ══ 妖怪（放大 2 倍・不規則出現・明顯走在街上） ══ */
.monster{position:fixed;bottom:0;left:0;pointer-events:none;z-index:20;will-change:transform,opacity;opacity:0;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.85))}
.mon-skeleton{width:104px;bottom:8px;animation:crossL 64s linear infinite, blink 19s linear infinite -6s}
.mon-reaper{width:128px;bottom:4px;animation:crossR 84s linear infinite, blink 27s linear infinite -14s}
.mon-reaper2{width:98px;bottom:52px;animation:crossL2 104s linear infinite -22s, blink 31s linear infinite -8s}
.mon-reaper3{width:75px;bottom:92px;animation:crossR 118s linear infinite -46s, blink 23s linear infinite -18s}
.mon-witch{top:8%;bottom:auto;width:150px;animation:crossL2 74s linear infinite -30s, blink 15s linear infinite -3s}
@keyframes crossL{from{transform:translateX(-400px)}to{transform:translateX(108vw)}}
@keyframes crossL2{from{transform:translateX(-520px)}to{transform:translateX(108vw)}}
@keyframes crossR{from{transform:translateX(110vw) scaleX(-1)}to{transform:translateX(-560px) scaleX(-1)}}
@keyframes blink{
  0%,5%{opacity:0}
  9%,42%{opacity:.92}
  48%,58%{opacity:0}
  64%,90%{opacity:.8}
  96%,100%{opacity:0}
}
.m-bob{animation:walkbob .65s ease-in-out infinite alternate}
@keyframes walkbob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.m-float{animation:floaty 2.4s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-20px) rotate(2deg)}}
.m-fly{animation:flybob 1.5s ease-in-out infinite alternate}
@keyframes flybob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(14px) rotate(3deg)}}
.leg-l,.leg-r,.arm-l,.arm-r{transform-box:fill-box;transform-origin:50% 0}
.leg-l{animation:swing .65s ease-in-out infinite alternate}
.leg-r{animation:swing .65s ease-in-out infinite alternate-reverse}
.arm-l{animation:swing .65s ease-in-out infinite alternate-reverse}
.arm-r{animation:swing .65s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}

/* ══ 頁首（恐怖文字） ══ */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 24px;
  background:rgba(6,4,9,.78);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(161,18,44,.4);
}
header h1{
  position:relative;
  font-family:'ZCOOL KuaiLe','Creepster','Noto Sans TC','Microsoft JhengHei',cursive;
  font-size:1.75rem;letter-spacing:.12em;color:#e0561a;
  filter:url(#ghoulish);
  text-shadow:0 0 14px rgba(201,79,13,.7), 0 0 40px rgba(161,18,44,.55), 0 2px 2px #000;
  animation:htitleflicker 7s linear infinite;
}
@keyframes htitleflicker{
  0%,100%{opacity:1}
  88%{opacity:1}89%{opacity:.65}90%{opacity:1}
  93%{opacity:.8}94%{opacity:1}
}
.drip{position:absolute;bottom:-12px;width:4px;border-radius:0 0 4px 4px;
  background:linear-gradient(#a1122c,#5c0716);
  box-shadow:0 0 5px rgba(161,18,44,.7);animation:dripgrow 6s ease-in-out infinite}
@keyframes dripgrow{0%,100%{height:12px}50%{height:18px}}
.badge{
  background:rgba(161,18,44,.14);border:1px solid rgba(161,18,44,.55);
  color:#e06a6a;border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:700;
}
.spacer{flex:1}
.moon-emoji{font-size:1.4rem;filter:drop-shadow(0 0 12px rgba(161,18,44,.8)) grayscale(.4)}

/* ══ 左右版面 ══ */
.layout{display:flex;align-items:flex-start;position:relative;z-index:10}
#sidebar{
  width:266px;flex-shrink:0;position:sticky;top:59px;
  height:calc(100vh - 59px);overflow-y:auto;
  background:rgba(10,7,15,.66);backdrop-filter:blur(8px);
  border-right:1px solid rgba(92,45,145,.4);
  padding:16px 10px 30px;
}
.side-title{
  font-family:'ZCOOL KuaiLe','Creepster','Noto Sans TC','Microsoft JhengHei',cursive;
  color:#e06a6a;font-size:1.05rem;letter-spacing:.14em;
  padding:4px 12px 12px;filter:url(#ghoulish);
  text-shadow:0 0 12px rgba(161,18,44,.6);
}
#folder-list{display:flex;flex-direction:column;gap:2px}
.folder-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;border-left:3px solid transparent;
  color:#9b93b0;font-family:inherit;font-size:.9rem;font-weight:500;
  padding:9px 12px;cursor:pointer;transition:background .18s, color .18s, box-shadow .18s;
}
.folder-item:hover{background:rgba(92,45,145,.2);color:var(--bone)}
.folder-item.active{
  background:rgba(161,18,44,.16);border-left-color:var(--blood);
  color:#e06a6a;box-shadow:inset 0 0 18px rgba(161,18,44,.18);
  text-shadow:0 0 8px rgba(161,18,44,.6);
}
.fi-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-count{
  margin-left:auto;font-size:.72rem;color:var(--muted);flex-shrink:0;
  border:1px solid rgba(92,45,145,.5);border-radius:999px;padding:1px 8px;
}
.folder-item.active .fi-count{color:#e06a6a;border-color:rgba(161,18,44,.6)}

/* ══ 右側舞台 ══ */
#stage{flex:1;min-width:0;padding-bottom:40px}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 24px 4px}
.btn{
  cursor:pointer;border:none;border-radius:13px;padding:11px 20px;
  font-family:inherit;font-size:.95rem;font-weight:900;color:#f0e8d8;letter-spacing:.06em;
  background:linear-gradient(135deg,#7a2a10,#4a1508);border:1px solid rgba(201,79,13,.5);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.btn:hover{
  transform:translateY(-3px);border-color:var(--accent);
  box-shadow:0 0 22px rgba(201,79,13,.5), 0 0 44px rgba(161,18,44,.25);
  color:#fff;
}
.btn:active{transform:translateY(-1px)}
.btn.ghosty{background:linear-gradient(135deg,#3a1d5c,#221038);border-color:rgba(92,45,145,.6)}
.btn.ghosty:hover{border-color:var(--purple-lt);box-shadow:0 0 22px rgba(138,91,191,.45)}
.hint{color:var(--muted);font-size:.82rem}
.hint b{color:var(--toxic)}
#stage-title{
  font-family:'ZCOOL KuaiLe','Creepster','Noto Sans TC','Microsoft JhengHei',cursive;
  color:var(--purple-lt);font-size:1.25rem;letter-spacing:.1em;margin:16px 24px 0;
  border-left:4px solid var(--blood);padding-left:12px;
  filter:url(#ghoulish);
  text-shadow:0 0 14px rgba(92,45,145,.8), 0 2px 2px #000;
}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;padding:14px 24px 26px;
}
.empty{
  grid-column:1/-1;text-align:center;padding:80px 20px;
  color:var(--muted);font-size:1.1rem;line-height:2.1;
}
.empty .big{font-size:3rem;display:block;margin-bottom:14px;animation:bob 5s ease-in-out infinite;
  filter:drop-shadow(0 0 18px rgba(161,18,44,.5))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ══ 相片 / 影片卡片 ══ */
.card{
  background:var(--card);border:1px solid rgba(92,45,145,.35);border-radius:16px;
  overflow:hidden;position:relative;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.card:hover{
  transform:translateY(-6px);border-color:var(--accent);
  box-shadow:0 0 26px rgba(201,79,13,.4), 0 0 60px rgba(161,18,44,.2), 0 16px 32px rgba(0,0,0,.7);
}
.card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:zoom-in;background:#000;
  filter:saturate(.82) contrast(1.05)}
.card:hover .thumb{filter:saturate(1) contrast(1.08)}
.card .thumb-video{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
.vbadge{
  position:absolute;top:8px;left:8px;z-index:2;
  background:rgba(6,4,9,.82);border:1px solid var(--blood);color:#e06a6a;
  font-size:.7rem;font-weight:900;border-radius:8px;padding:2px 9px;letter-spacing:.06em;
}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.card .name{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bone)}
.card .sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.size{color:var(--muted);font-size:.74rem;white-space:nowrap}
.zoom{
  background:transparent;border:1px solid var(--purple-lt);color:var(--purple-lt);
  border-radius:10px;padding:5px 12px;font-size:.8rem;cursor:pointer;
  font-family:inherit;font-weight:900;white-space:nowrap;transition:all .2s ease;
}
.zoom:hover{background:var(--purple);color:#fff;transform:translateY(-2px);box-shadow:0 0 16px rgba(92,45,145,.7)}

/* ══ 拖曳覆蓋層 ══ */
#drop-overlay{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;
  background:rgba(4,3,8,.85);backdrop-filter:blur(6px);
}
#drop-overlay.active{display:flex}
#drop-overlay .box{
  border:3px dashed var(--blood);border-radius:26px;padding:64px 70px;text-align:center;
  color:#e06a6a;font-size:1.5rem;font-weight:900;line-height:2;
  box-shadow:inset 0 0 50px rgba(161,18,44,.25), 0 0 60px rgba(161,18,44,.3);
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* ══ 燈箱（圖 / 影片） ══ */
#lightbox{
  position:fixed;inset:0;z-index:90;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(3,2,6,.96);
}
#lightbox.open{display:flex}
#lb-media{display:flex;align-items:center;justify-content:center;max-width:94vw;max-height:82vh}
.lb-img-el{max-width:92vw;max-height:78vh;border-radius:14px;
  box-shadow:0 0 60px rgba(161,18,44,.4), 0 0 120px rgba(92,45,145,.3)}
.lb-vid{max-width:92vw;max-height:78vh;border-radius:14px;background:#000;
  box-shadow:0 0 60px rgba(161,18,44,.4), 0 0 120px rgba(92,45,145,.3)}
#lb-cap{margin-top:16px;color:var(--bone);font-size:.95rem;max-width:84vw;text-align:center;word-break:break-all}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(161,18,44,.6);
  background:rgba(16,11,22,.85);color:#e0803c;font-size:1.5rem;cursor:pointer;transition:all .2s ease;
}
.lb-nav:hover{background:var(--accent);color:#0c0502;box-shadow:0 0 22px rgba(201,79,13,.7)}
#lb-prev{left:22px}
#lb-next{right:22px}
#lb-close{
  position:absolute;top:18px;right:22px;width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(92,45,145,.7);background:rgba(16,11,22,.85);
  color:#e06a6a;font-size:1.3rem;cursor:pointer;transition:all .2s ease;
}
#lb-close:hover{background:var(--blood);color:#fff;box-shadow:0 0 22px rgba(161,18,44,.7)}

/* ══ 通知 ══ */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  z-index:120;background:var(--card);border:1px solid var(--blood);color:var(--bone);
  border-radius:14px;padding:12px 22px;font-size:.92rem;font-weight:700;
  opacity:0;pointer-events:none;transition:all .3s ease;
  box-shadow:0 0 24px rgba(161,18,44,.45);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{position:relative;z-index:10;text-align:center;color:var(--muted);font-size:.78rem;padding:10px 0 26px}
footer span{color:var(--purple-lt)}

/* ══ 響應式 (RWD) ══ */
@media (max-width:760px){
  .layout{flex-direction:column}
  #sidebar{
    position:static;width:100%;height:auto;max-height:190px;
    border-right:none;border-bottom:1px solid rgba(92,45,145,.4);
  }
  #folder-list{flex-direction:row;overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px}
  .folder-item{width:auto;flex-shrink:0;border-left:none;border-bottom:3px solid transparent}
  .folder-item.active{border-bottom-color:var(--blood)}
  header{padding:11px 16px}
  header h1{font-size:1.3rem}
  .toolbar{padding:16px 16px 4px}
  .hint{width:100%}
  #stage-title{margin:14px 16px 0;font-size:1.05rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 16px 20px}
  .moon-wrap{width:100px;height:100px;top:6%;left:6%}
  .scene{height:42vh}
  .mon-skeleton{width:75px}
  .mon-reaper{width:90px}
  .mon-reaper2,.mon-reaper3{display:none}
  .mon-witch{width:105px}
  .lb-nav{width:44px;height:44px}
}
</style>
</head>
<body>

<!-- 恐怖文字蝕蝕濾鏡 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ghoulish">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
  </filter>
</svg>

<!-- ══ 月亮 ══ -->
<div class="moon-wrap" aria-hidden="true">
  <div class="moon-halo"></div>
  <svg viewBox="0 0 150 150" style="position:absolute;inset:0;width:100%;height:100%">
    <circle cx="75" cy="75" r="52" fill="#d9d2e6" opacity=".95"/>
    <circle cx="58" cy="60" r="9" fill="#b9b0cc" opacity=".7"/>
    <circle cx="90" cy="82" r="12" fill="#b9b0cc" opacity=".55"/>
    <circle cx="72" cy="100" r="6" fill="#b9b0cc" opacity=".6"/>
    <circle cx="100" cy="55" r="5" fill="#b9b0cc" opacity=".5"/>
    <circle cx="48" cy="88" r="4.5" fill="#b9b0cc" opacity=".5"/>
  </svg>
</div>

<!-- ══ 破碎老城 + 老城堡剪影（加強版：石板老街、更清楚的輪廓） ══ -->

  <!-- 老城堡（右側） -->
  <g fill="#0d0919">
    <polygon points="690,150 760,150 725,92 745,118 712,150"/>
    <rect x="690" y="150" width="70" height="370"/>

    <rect x="760" y="192" width="24" height="20"/><rect x="806" y="192" width="24" height="20"/>

    <rect x="714" y="196" width="7" height="18" rx="3"/>

    <rect x="836" y="258" width="8" height="22" rx="3"/>
    <rect x="872" y="258" width="8" height="22" rx="3"/>

    <rect x="140" y="306" width="112" height="214"/>
    <polygon points="140,306 252,306 232,258 186,286 150,272"/>
    <rect x="266" y="330" width="96" height="190"/>
    <polygon points="266,330 362,330 338,292 300,312 268,304"/>
    <rect x="376" y="352" width="88" height="168"/>
    <polygon points="376,352 464,352 442,318 400,336"/>
    <rect x="180" y="238" width="16" height="52"/>
    <rect x="52" y="196" width="14" height="44"/>
    <path d="M470 520 L470 430 Q520 380 560 430 L560 520 L536 520 L536 448 Q520 420 504 448 L504 520 Z"/>
  </g>
  <!-- 屋舍暗窗 -->
  <g fill="#4a2410" opacity=".8">
    <rect x="34" y="300" width="7" height="16" rx="2"/>
    <rect x="76" y="300" width="7" height="16" rx="2"/>
    <rect x="170" y="336" width="7" height="16" rx="2"/>

  </g>
  <!-- 石板老街（中央主街道，妖怪在此行走） -->
  <polygon points="300,520 960,520 740,352 560,352" fill="#131024"/>
  <g stroke="#2b2144" stroke-width="2" fill="none" opacity=".7">
    <path d="M330 500 Q630 482 930 500"/>
    <path d="M365 474 Q630 458 895 474"/>
    <path d="M400 448 Q630 434 860 448"/>
    <path d="M435 424 Q630 412 825 424"/>
    <path d="M470 402 Q630 392 790 402"/>

  </g>
  <!-- 路側石階 -->
  <polygon points="300,520 560,352 574,352 314,520" fill="#1a1430"/>
  <polygon points="960,520 740,352 726,352 946,520" fill="#1a1430"/>
  <!-- 老街燈（毒液綠微光，兩盞） -->
  <g>
    <rect x="492" y="330" width="5" height="190" fill="#0d0919"/>

  <button id="lb-close" title="關閉 (Esc)">✕</button>
  <button class="lb-nav" id="lb-prev" title="上一項 (←)">‹</button>
  <div id="lb-media"></div>
  <button class="lb-nav" id="lb-next" title="下一項 (→)">›</button>
  <div id="lb-cap"></div>
</div>

<div id="toast"></div>
<input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.mov,image/jpeg,image/png,image/gif,image/webp,video/quicktime" hidden>

<script>
const $ = (s) => document.querySelector(s);
let allPhotos = [];
let folders = [];
let selected = "";
let view = [];
let lbIndex = -1;
let toastTimer = null;

function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function showBackslash(rel){ return rel.replace(/\//g, '\\'); }

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

async function fetchAll(){
  const [rp, rf] = await Promise.all([
    fetch('/api/photos', {cache:'no-store'}),
    fetch('/api/folders', {cache:'no-store'})
  ]);
  allPhotos = (await rp.json()).photos || [];
  folders = (await rf.json()).folders || [];
}

function selectFolder(rel){
  selected = rel;
  view = allPhotos.filter(p => (p.folder || '') === rel);
  renderFolders();
  render();
}

function folderItem(rel, icon, label, count, depth){
  const b = document.createElement('button');
  b.className = 'folder-item' + ((selected || '') === rel ? ' active' : '');
  b.style.paddingLeft = (12 + (depth || 0) * 14) + 'px';
  const ic = document.createElement('span'); ic.textContent = icon;
  const nm = document.createElement('span'); nm.className = 'fi-name';
  nm.textContent = label;
  nm.title = rel ? showBackslash(rel) : 'D:\\照片 根目錄';
  const ct = document.createElement('span'); ct.className = 'fi-count'; ct.textContent = count;
  b.append(ic, nm, ct);
  b.addEventListener('click', () => selectFolder(rel));
  return b;
}

function renderFolders(){
  const list = $('#folder-list');
  list.innerHTML = '';
  const rootCount = allPhotos.filter(p => !p.folder).length;
  list.appendChild(folderItem('', '🏠', '根目錄（全部）', rootCount, 0));
  folders.filter(f => f.rel).forEach(f =>
    list.appendChild(folderItem(f.rel, '📁', f.name, f.count, f.depth)));
}

function render(){
  const vids = allPhotos.filter(p => p.kind === 'video').length;
  $('#count').textContent = `共 ${allPhotos.length} 項` + (vids ? `（🎬 ${vids}）` : '');
  $('#stage-title').textContent = selected
    ? `📁 ${showBackslash(selected)}`
    : '🏠 根目錄（D:\\照片）';
  const grid = $('#stage-grid');
  grid.innerHTML = '';
  if(!view.length){
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = '<span class="big">🎃</span>這個資料夾還沒有照片或影片…<br>點上方「上傳」，或直接把檔案拖曳到這裡 👻';
    grid.appendChild(div);
    return;
  }
  view.forEach((p, i) => grid.appendChild(makeCard(p, i)));
}

function makeCard(p, i){
  const card = document.createElement('div');
  card.className = 'card';
  if(p.kind === 'video'){
    const vid = document.createElement('video');
    vid.className = 'thumb-video';
    vid.src = p.url;
    vid.controls = true;
    vid.muted = true;
    vid.playsInline = true;
    vid.preload = 'metadata';
    vid.loop = true;
    const badge = document.createElement('span');
    badge.className = 'vbadge';
    badge.textContent = '🎬 MOV 影片';
    card.appendChild(badge);
    card.appendChild(vid);
  } else {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = p.url;
    img.alt = p.name;
    img.loading = 'lazy';
    img.title = '點一下放大檢視';
    img.addEventListener('click', () => openLb(i));
    card.appendChild(img);
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = p.name;
  name.title = showBackslash(p.rel);
  const sub = document.createElement('div');
  sub.className = 'sub';
  const size = document.createElement('span');
  size.className = 'size';
  size.textContent = fmtSize(p.size);
  const zoom = document.createElement('button');
  zoom.className = 'zoom';
  zoom.textContent = p.kind === 'video' ? '🔍 放大播放' : '🔍 放大';
  zoom.title = p.kind === 'video' ? '全畫面播放影片' : '放大檢視';
  zoom.addEventListener('click', () => openLb(i));
  sub.append(size, zoom);
  meta.append(name, sub);
  card.appendChild(meta);
  return card;
}

const fileInput = $('#file-input');
$('#upload-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if(fileInput.files.length) uploadFiles(fileInput.files);
  fileInput.value = '';
});

async function uploadFiles(files){
  const fd = new FormData();
  Array.from(files).forEach(f => fd.append('files', f));
  toast('⏳ 上傳中…');
  try{
    const r = await fetch('/api/upload', {method:'POST', body: fd});
    const d = await r.json();
    if(d.created && d.created.length) toast(`✅ 已收下 ${d.created.length} 個檔案，存入根目錄 🎃`);
    if(d.errors && d.errors.length) toast('⚠️ 有檔案不符合格式，已跳過');
    await fetchAll();
    selectFolder('');
  }catch(e){ toast('❌ 上傳失敗：' + e.message); }
}

let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault(); dragDepth++;
  $('#drop-overlay').classList.add('active');
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if(dragDepth === 0) $('#drop-overlay').classList.remove('active');
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  $('#drop-overlay').classList.remove('active');
  const files = Array.from(e.dataTransfer.files).filter(f => /\.(jpe?g|png|gif|webp|mov)$/i.test(f.name));
  if(files.length) uploadFiles(files);
  else toast('🚫 只接受 jpg / jpeg / png / gif / webp / mov');
});

/* 燈箱：圖片或影片 */
function openLb(i){
  lbIndex = i;
  $('#lightbox').classList.add('open');
  showLb();
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  $('#lightbox').classList.remove('open');
  $('#lb-media').innerHTML = '';
  lbIndex = -1;
  document.body.style.overflow = '';
}
function showLb(){
  const p = view[lbIndex];
  const media = $('#lb-media');
  media.innerHTML = '';
  if(p.kind === 'video'){
    const v = document.createElement('video');
    v.src = p.url;
    v.controls = true;
    v.autoplay = true;
    v.className = 'lb-vid';
    media.appendChild(v);
  } else {
    const im = document.createElement('img');
    im.src = p.url;
    im.className = 'lb-img-el';
    media.appendChild(im);
  }
  $('#lb-cap').textContent =
    (p.kind === 'video' ? '🎬 ' : '') + showBackslash(p.rel) + `　·　第 ${lbIndex + 1} / ${view.length} 項`;
}
function nav(d){
  if(!view.length) return;
  lbIndex = (lbIndex + d + view.length) % view.length;
  showLb();
}
$('#lb-close').addEventListener('click', closeLb);
$('#lb-prev').addEventListener('click', () => nav(-1));
$('#lb-next').addEventListener('click', () => nav(1));
$('#lightbox').addEventListener('click', (e) => { if(e.target.id === 'lightbox') closeLb(); });
document.addEventListener('keydown', (e) => {
  if(lbIndex < 0) return;
  if(e.key === 'Escape') closeLb();
  else if(e.key === 'ArrowRight') nav(1);
  else if(e.key === 'ArrowLeft') nav(-1);
});

$('#refresh-btn').addEventListener('click', async () => {
  await fetchAll();
  selectFolder(selected);
  toast('🦇 已重新掃描資料夾');
});

(async function init(){
  try{
    await fetchAll();
    selectFolder('');
  }catch(e){
    // GitHub Pages 等靜態主機沒有 Flask 後端 → 離線展示模式
    const grid = $('#stage-grid');
    grid.innerHTML = '<div class="empty"><span class="big">🎃</span>離線展示模式 👻<br>此頁面為靜態展示，無法讀取本機照片。<br>在本機執行 <b>python app.py</b> 開啟 http://127.0.0.1:5000 即可使用完整功能。</div>';
    toast('🌐 離線展示模式（偵測不到本機伺服器）');
  }
})();
</script>
</body>
